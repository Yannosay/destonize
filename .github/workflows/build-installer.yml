name: Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Inno Setup
      shell: pwsh
      run: |
        choco install innosetup -y --no-progress

    - name: Build and Publish
      shell: pwsh
      run: |
        dotnet publish src\Destonize\Destonize.csproj -c Release -r win-x64 --self-contained false -o publish

    - name: Compile Installer
      shell: pwsh
      run: |
        $iscc = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "Inno Setup" } |
                Select-Object -First 1
        if (-not $iscc) {
          throw "Inno Setup compiler not found"
        }
        & $iscc.FullName installer.iss

    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: DestonizeSetup
        path: dist\DestonizeSetup.exe